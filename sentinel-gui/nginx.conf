# Sentinel Control-Plane entrypoint.
#
# This nginx does TWO jobs, deliberately combined rather than split into a
# separate reverse-proxy container (see docs/sentinel-integration.md and the
# GUI control-plane migration notes): it serves the built SPA, AND it is the
# Sentinel EC2's public reverse proxy in front of sentinel-ai. The browser
# only ever talks to this one origin — see src/api/client.js and
# src/api/events.js, which now call same-origin /api/... paths instead of an
# absolute VITE_API_BASE_URL.
#
# This container is the only thing on the Sentinel EC2 that publishes a
# public port (see infra/terraform/sentinel_user_data.sh.tftpl). sentinel-ai
# is reached ONLY over the private "sentinel-net" Docker network below, by
# its container/network-alias name — never through this host's public IP —
# so sentinel-ai:8080 itself is never exposed publicly just to make the GUI
# work.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets (Vite hashes filenames) can be cached
    # aggressively — a new deploy always ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # sentinel-ai reverse proxy
    # ------------------------------------------------------------------
    # IMPORTANT — read before adding a route here:
    #
    # sentinel-ai's API has three trust tiers on one process (see
    # sentinel-ai/app/core/deps.py and app/main.py's CORS comment):
    #   * POST /api/alerts/webhook is genuinely UNAUTHENTICATED — it is the
    #     Alertmanager trigger for autonomous remediation. It has no
    #     GUI page and Alertmanager never needs the public path — it
    #     already reaches sentinel-ai directly over the private VPC network
    #     (see infra/terraform/sentinel_remote.tf's sentinel_webhook_from_k3s
    #     rule) — so it stays explicitly denied here, BEFORE the general
    #     /api/ proxy below, rather than relied on to just not be guessed.
    #   * /api/sentinel/chaos-scenarios* is gated by its own pre-existing
    #     shared-secret header (X-Chaos-Token, checked in
    #     app/routers/chaos_scenarios.py) rather than the admin JWT. The
    #     sentinel-gui "Chaos scenarios" page (src/pages/DemoChaosPage.jsx)
    #     calls this same-origin, so it MUST be proxied like the rest —
    #     denying it here would 404 that page's own listScenarios() call
    #     before it ever reaches sentinel-ai. The shared secret is the
    #     security boundary for this path, not this proxy.
    #   * Everything else under /api/ is admin-JWT-authenticated
    #     (get_current_admin) and is genuinely safe to expose publicly.
    location = /api/alerts/webhook {
        return 404;
    }

    # Everything else under /api/ — dashboard, incidents, actions,
    # performance, meta, auth, environments, feedback, config,
    # authorizations, events (SSE), chaos-scenarios — is either
    # admin-JWT-authenticated or (chaos-scenarios only) gated by its own
    # X-Chaos-Token, so proxying it same-origin is what lets the browser
    # bundle drop its absolute VITE_API_BASE_URL entirely.
    location /api/ {
        proxy_pass http://sentinel-ai:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/events is a long-lived Server-Sent Events stream (see
        # sentinel-ai/app/routers/events.py, which already sets
        # X-Accel-Buffering: no on its own responses in anticipation of
        # exactly this proxy). Buffering must also be off here, or events
        # sit in nginx's buffer instead of streaming; a generous read
        # timeout keeps the connection open between heartbeats
        # (sentinel-ai emits one every 15s) instead of nginx closing it
        # early. HTTP/1.1 + an empty Connection header keep the upstream
        # connection open rather than "Connection: close" cycling it.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Environment API routes are exposed directly by sentinel-ai.
    location = /environments {
        proxy_pass http://sentinel-ai:8080/environments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /environments/ {
        proxy_pass http://sentinel-ai:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }   

    # React Router: any path that isn't a real file falls back to
    # index.html so client-side routing (e.g. /incidents/:id) works on a
    # hard refresh or direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
