server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets (Vite hashes filenames) can be cached
    # aggressively — a new deploy always ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # This app calls sentinel-ai directly, cross-origin, from the browser
    # (see src/api/client.js's VITE_API_BASE_URL) — sentinel-ai's own CORS
    # middleware (SENTINEL_GUI_ORIGINS) is what authorizes that, so there is
    # no same-origin API proxy here to keep in sync with sentinel-ai's route
    # table.

    # React Router: any path that isn't a real file falls back to
    # index.html so client-side routing (e.g. /incidents/:id) works on a
    # hard refresh or direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
