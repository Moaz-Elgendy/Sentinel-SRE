server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets (Vite hashes filenames) can be cached
    # aggressively — a new deploy always ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy for Sentinel's operator API. In the default
    # in-cluster topology this points at http://sentinel-ai:8080; in the
    # external-control-plane topology it points at the standalone Sentinel
    # EC2 private IP, e.g. http://10.20.1.123:8080.
    location = /api/sentinel {
        proxy_pass ${SENTINEL_API_UPSTREAM}/api/sentinel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/sentinel/ {
        proxy_pass ${SENTINEL_API_UPSTREAM}/api/sentinel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: any path that isn't a real file falls back to
    # index.html so client-side routing (e.g. /requests/:id) works on a
    # hard refresh or direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
