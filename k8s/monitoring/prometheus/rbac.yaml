# Prometheus's kubernetes_sd_configs (role: pod — see configmap.yaml) needs
# permission to list/watch pods so it can discover scrape targets by
# annotation. Scoped to a Role in the citizen-portal namespace only — this
# stack only ever monitors this one namespace, so a cluster-wide ClusterRole
# would be more access than it needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: citizen-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: citizen-portal
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: citizen-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: citizen-portal
