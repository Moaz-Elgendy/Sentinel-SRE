# Provisioned datasources — no manual "Add data source" click-through
# needed after deploy. Fixed uids (prometheus / loki) so the dashboard
# JSON in dashboard-json-configmap.yaml can reference them directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: citizen-portal
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
