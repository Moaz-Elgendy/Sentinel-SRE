# Created here as a plain manifest for local kind/minikube use (Phase 8).
# In a real cluster, generate this with `kubectl create secret generic ...`
# or a secrets manager (SOPS / External Secrets, planned for Phase 11 CI/CD)
# instead of committing literal values — these mirror the same
# demo-only "sentinal" placeholders used in .env.example, not real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: citizen-postgres-secret
  namespace: citizen-portal
type: Opaque
stringData:
  POSTGRES_USER: app_user
  POSTGRES_PASSWORD: sentinal
  POSTGRES_DB: citizen_portal
