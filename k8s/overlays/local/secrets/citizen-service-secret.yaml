# See k8s/overlays/local/secrets/citizen-postgres-secret.yaml for the note on real-secret handling.
# Must match citizen-postgres-secret's POSTGRES_USER/PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: citizen-service-secret
  namespace: citizen-portal
type: Opaque
stringData:
  DATABASE_USER: app_user
  DATABASE_PASSWORD: sentinal
  JWT_SECRET: sentinal
  CHAOS_ADMIN_TOKEN: replace_me
