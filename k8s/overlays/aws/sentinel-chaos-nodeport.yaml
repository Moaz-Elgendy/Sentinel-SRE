# Private-only access for the external Sentinel control plane.
#
# The /api/chaos/* endpoints are implemented by citizen-service and
# notification-service themselves; there is no separate chaos deployment.
# These NodePorts preserve that ownership while allowing the external
# Sentinel EC2 to reach the APIs over the VPC. AWS security-group rules
# restrict both ports to the Sentinel instance security group.
apiVersion: v1
kind: Service
metadata:
  name: citizen-service-chaos-nodeport
  namespace: citizen-portal
  labels:
    app: citizen-service
    exposure: remote-sentinel-chaos
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector:
    app: citizen-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-chaos-nodeport
  namespace: citizen-portal
  labels:
    app: notification-service
    exposure: remote-sentinel-chaos
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector:
    app: notification-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081