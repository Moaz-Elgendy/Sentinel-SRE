# Sentinel's non-secret configuration.
#
# Secrets (OpenAI key, GitHub token, Slack webhook, chaos admin token) come
# from the `sentinel-secret` Secret generated by the overlay's
# secretGenerator from a gitignored env file — see
# k8s/overlays/aws/secrets/sentinel.env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: citizen-portal
  labels:
    app: sentinel-ai
data:
  # --- Observability sources Sentinel reads -------------------------------
  # All in-cluster ClusterIP Services. Sentinel reads monitoring data over
  # the cluster network; none of these are exposed publicly.
  PROMETHEUS_URL: http://prometheus:9090
  LOKI_URL: http://loki:3100
  ALERTMANAGER_URL: http://alertmanager:9093

  # --- Services Sentinel probes and can reset chaos on --------------------
  CITIZEN_SERVICE_URL: http://citizen-service:8000
  NOTIFICATION_SERVICE_URL: http://notification-service:8000

  # --- Autonomy ----------------------------------------------------------
  # DRY_RUN=false means Sentinel actually executes remediation, including
  # rollback, with no human approval step. That is the intended behaviour
  # for this project and the whole point of the phase.
  #
  # Set it to "true" to have Sentinel run the full lifecycle — detect,
  # investigate, correlate, decide, validate policy — and log the action it
  # WOULD have taken without touching the cluster. Useful when first
  # watching it work, and the honest way to demo it to someone who is not
  # yet comfortable with it acting unattended.
  DRY_RUN: "false"

  # --- Remediation allow-lists ------------------------------------------
  # Enforced by the Policy Engine before any Kubernetes call, and mirrored
  # (more coarsely) by the RBAC Role in namespace-rbac.yaml.
  #
  # Note what is NOT here: citizen-postgres and notification-postgres.
  # Databases are deliberately non-remediable. Restarting a Postgres pod
  # under load is a plausible-looking action that risks data loss and
  # fixes almost nothing, and rolling one back is meaningless. A database
  # incident escalates to a human instead — which is the correct answer,
  # not a limitation.
  ALLOWED_NAMESPACES: citizen-portal
  ALLOWED_DEPLOYMENTS: citizen-service,notification-service,frontend

  # --- Confidence thresholds --------------------------------------------
  # Rollback carries the highest bar because it is the action with the
  # largest effect: it changes what code is running. Restart and scale are
  # cheap and self-correcting by comparison.
  #
  # These are policy thresholds, not guarantees of correctness. A
  # confidence number produced partly by an LLM is a heuristic; the
  # preconditions checked alongside it (does a previous revision exist, does
  # a deploy correlate with the incident onset) are the parts that actually
  # make rollback safe.
  CONFIDENCE_ROLLBACK: "0.95"
  CONFIDENCE_RESTART: "0.90"
  CONFIDENCE_SCALE: "0.90"
  CONFIDENCE_RESET_CHAOS: "0.90"

  # --- Guard rails -------------------------------------------------------
  # Bounds on scale_deployment. Never 0: scaling to zero is an outage, not
  # a remediation, and it is exactly what the `full-outage` chaos scenario
  # does deliberately. MAX_REPLICAS=3 is what a 2 vCPU node can actually
  # absorb.
  MIN_REPLICAS: "1"
  MAX_REPLICAS: "3"

  # Stops a remediation loop. After this many actions on one incident
  # without validation passing, Sentinel escalates instead of continuing to
  # try things — an agent that retries indefinitely is worse than one that
  # gives up and says so.
  MAX_ACTIONS_PER_INCIDENT: "3"

  # Prevents the same action being fired repeatedly at the same target
  # while the first one is still settling.
  ACTION_COOLDOWN_SECONDS: "120"

  # How recent a deployment has to be to be considered a plausible cause of
  # an incident. Too wide and every incident gets blamed on the last deploy;
  # too narrow and a slow-burning bad release is missed.
  DEPLOYMENT_CORRELATION_WINDOW_MINUTES: "30"

  # --- Recovery validation ----------------------------------------------
  # Settle first (a rollout takes time to produce meaningful signal; error
  # rate over a 5m window needs the window to move), then poll until the
  # timeout.
  VALIDATION_SETTLE_SECONDS: "45"
  VALIDATION_TIMEOUT_SECONDS: "300"

  # --- LLM ---------------------------------------------------------------
  # If OPENAI_API_KEY is not set in sentinel-secret, Sentinel runs fully
  # rule-based: it still detects, investigates, correlates, decides,
  # remediates and validates, and it records in the incident that the RCA
  # narrative was generated without LLM enrichment. Nothing silently
  # degrades or fails closed.
  OPENAI_MODEL: gpt-4o-mini

  # --- Storage -----------------------------------------------------------
  SENTINEL_DB_PATH: /data/sentinel.db
