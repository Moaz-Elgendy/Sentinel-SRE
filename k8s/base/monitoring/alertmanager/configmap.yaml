# A deliberately minimal routing tree. The default receiver has no
# integrations configured (no Slack/PagerDuty/email webhook) — alerts
# route here and are visible in Alertmanager's UI/API, but nothing gets
# paged. This is honest about where this stack currently stands: real
# notification delivery is a real integration decision (which
# service? whose on-call?) that shouldn't be faked with a placeholder
# webhook URL that would just silently fail. Wiring a real receiver is
# listed as a next step in Phases.md Phase 9.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: citizen-portal
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ["alertname", "app"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default
