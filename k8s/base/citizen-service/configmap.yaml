apiVersion: v1
kind: ConfigMap
metadata:
  name: citizen-service-config
  namespace: citizen-portal
data:
  DATABASE_HOST: citizen-postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: citizen_portal
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "1440"
  NOTIFICATION_SERVICE_URL: http://notification-service:8000
  # Ingress terminates the public hostname; the frontend is served from
  # the same host under "/", so this only needs to list that host (plus
  # localhost for `kubectl port-forward` during local debugging).
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://citizen-portal.local"
  CHAOS_MODE: "false"
  UPLOAD_DIR: /data/uploads
